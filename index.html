<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <div class="logo">🎓</div>
        <h1>Student Registration</h1>
        <p>Fill in the details below to register</p>
      </div>

      <form id="registrationForm" novalidate>

        <!-- Personal Information -->
        <section class="form-section">
          <h2 class="section-title">Personal Information</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name <span class="required">*</span></label>
              <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required />
              <span class="error-msg" id="firstNameError"></span>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name <span class="required">*</span></label>
              <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required />
              <span class="error-msg" id="lastNameError"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="dob">Date of Birth <span class="required">*</span></label>
              <input type="date" id="dob" name="dob" required />
              <span class="error-msg" id="dobError"></span>
            </div>
            <div class="form-group">
              <label for="gender">Gender <span class="required">*</span></label>
              <select id="gender" name="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer_not">Prefer not to say</option>
              </select>
              <span class="error-msg" id="genderError"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="nationality">Nationality</label>
            <input type="text" id="nationality" name="nationality" placeholder="Enter nationality" />
          </div>
        </section>

        <!-- Contact Information -->
        <section class="form-section">
          <h2 class="section-title">Contact Information</h2>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required />
            <span class="error-msg" id="emailError"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number <span class="required">*</span></label>
              <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900" required />
              <span class="error-msg" id="phoneError"></span>
            </div>
            <div class="form-group">
              <label for="altPhone">Alternate Phone</label>
              <input type="tel" id="altPhone" name="altPhone" placeholder="+1 234 567 8900" />
            </div>
          </div>

          <div class="form-group">
            <label for="address">Address <span class="required">*</span></label>
            <textarea id="address" name="address" rows="3" placeholder="Enter full address" required></textarea>
            <span class="error-msg" id="addressError"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City <span class="required">*</span></label>
              <input type="text" id="city" name="city" placeholder="City" required />
              <span class="error-msg" id="cityError"></span>
            </div>
            <div class="form-group">
              <label for="zipCode">ZIP / Postal Code</label>
              <input type="text" id="zipCode" name="zipCode" placeholder="ZIP Code" />
            </div>
          </div>
        </section>

        <!-- Academic Information -->
        <section class="form-section">
          <h2 class="section-title">Academic Information</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="studentId">Student ID</label>
              <input type="text" id="studentId" name="studentId" placeholder="Auto-generated if blank" />
            </div>
            <div class="form-group">
              <label for="enrollmentYear">Enrollment Year <span class="required">*</span></label>
              <select id="enrollmentYear" name="enrollmentYear" required>
                <option value="">-- Select Year --</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
              </select>
              <span class="error-msg" id="enrollmentYearError"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="department">Department <span class="required">*</span></label>
              <select id="department" name="department" required>
                <option value="">-- Select Department --</option>
                <option value="cs">Computer Science</option>
                <option value="ee">Electrical Engineering</option>
                <option value="me">Mechanical Engineering</option>
                <option value="ce">Civil Engineering</option>
                <option value="ba">Business Administration</option>
                <option value="med">Medicine</option>
                <option value="law">Law</option>
                <option value="arts">Arts & Humanities</option>
              </select>
              <span class="error-msg" id="departmentError"></span>
            </div>
            <div class="form-group">
              <label for="program">Program <span class="required">*</span></label>
              <select id="program" name="program" required>
                <option value="">-- Select Program --</option>
                <option value="bachelor">Bachelor's Degree</option>
                <option value="master">Master's Degree</option>
                <option value="phd">PhD</option>
                <option value="diploma">Diploma</option>
                <option value="certificate">Certificate</option>
              </select>
              <span class="error-msg" id="programError"></span>
            </div>
          </div>

          <div class="form-group">
            <label>Subjects of Interest</label>
            <div class="checkbox-group">
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="math" /> Mathematics</label>
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="physics" /> Physics</label>
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="chemistry" /> Chemistry</label>
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="biology" /> Biology</label>
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="cs" /> Computer Science</label>
              <label class="checkbox-label"><input type="checkbox" name="subjects" value="economics" /> Economics</label>
            </div>
          </div>
        </section>

        <!-- Emergency Contact -->
        <section class="form-section">
          <h2 class="section-title">Emergency Contact</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="emergencyName">Contact Name <span class="required">*</span></label>
              <input type="text" id="emergencyName" name="emergencyName" placeholder="Full name" required />
              <span class="error-msg" id="emergencyNameError"></span>
            </div>
            <div class="form-group">
              <label for="relationship">Relationship <span class="required">*</span></label>
              <select id="relationship" name="relationship" required>
                <option value="">-- Select --</option>
                <option value="parent">Parent</option>
                <option value="guardian">Guardian</option>
                <option value="sibling">Sibling</option>
                <option value="spouse">Spouse</option>
                <option value="other">Other</option>
              </select>
              <span class="error-msg" id="relationshipError"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="emergencyPhone">Emergency Phone <span class="required">*</span></label>
            <input type="tel" id="emergencyPhone" name="emergencyPhone" placeholder="+1 234 567 8900" required />
            <span class="error-msg" id="emergencyPhoneError"></span>
          </div>
        </section>

        <!-- Terms -->
        <section class="form-section">
          <div class="form-group checkbox-single">
            <label class="checkbox-label">
              <input type="checkbox" id="terms" name="terms" required />
              I agree to the <a href="#" class="link">Terms and Conditions</a> and <a href="#" class="link">Privacy Policy</a>
            </label>
            <span class="error-msg" id="termsError"></span>
          </div>
        </section>

        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Register Now</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">✅</div>
      <h2>Registration Successful!</h2>
      <p id="modalMessage">Your registration has been submitted successfully.</p>
      <button class="btn btn-primary" onclick="closeModal()">Done</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
